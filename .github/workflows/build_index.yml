name: Generate PyPI Index

on:
  push:
    paths:
      - 'docs/**' # Trigger only when docs directory changes
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ensure we have push permission

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate PEP 503 Index
        run: |
          python3 << 'EOF'
          import os
          import hashlib

          base_dir = "docs"
          
          # Generate root index
          root_index = "<!DOCTYPE html>\n<html>\n  <body>\n"
          
          for pkg_name in sorted(os.listdir(base_dir)):
              pkg_path = os.path.join(base_dir, pkg_name)
              if not os.path.isdir(pkg_path):
                  continue
                  
              root_index += f'    <a href="{pkg_name}/">{pkg_name}</a><br>\n'
              
              # Generate package index
              pkg_index = "<!DOCTYPE html>\n<html>\n  <body>\n"
              for whl_file in sorted(os.listdir(pkg_path)):
                  if not whl_file.endswith(".whl"):
                      continue
                  
                  file_full_path = os.path.join(pkg_path, whl_file)
                  with open(file_full_path, "rb") as f:
                      sha256 = hashlib.sha256(f.read()).hexdigest()
                  
                  pkg_index += f'    <a href="{whl_file}#sha256={sha256}">{whl_file}</a><br>\n'
              
              pkg_index += "  </body>\n</html>"
              
              with open(os.path.join(pkg_path, "index.html"), "w") as f:
                  f.write(pkg_index)
                  
          root_index += "  </body>\n</html>"
          
          with open(os.path.join(base_dir, "index.html"), "w") as f:
              f.write(root_index)
              
          print("Index generated successfully!")
          EOF


      - name: Commit and Push Index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*/index.html docs/index.html
          git diff --staged --quiet || git commit -m "Auto-update PEP 503 index"
          git push
